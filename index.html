<script>
  // Local storage-backed polyfill so picks persist on a real deployed site
  // (mirrors the get/set/delete/list shape used by the component)
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      if (v === null) throw new Error("not found");
      return { key, value: v, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };
</script>

  { key: "rb", label: "RB" },

function normalize(s) {
  return s
    .toLowerCase()
    .replace(/\./g, "")
    .replace(/\b(jr|sr|ii|iii|iv)\b/g, "")
    .replace(/[^a-z0-9]/g, "");
}

// relative luminance -> pick readable text color against a hex bg
function textOn(hex) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16) / 255;
  const g = parseInt(h.substring(2, 4), 16) / 255;
  const b = parseInt(h.substring(4, 6), 16) / 255;
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return lum > 0.55 ? "#101214" : "#F5F3EE";
}

// build a flat lookup of every player -> {teamAbbr, slot, index}
function buildIndex() {
  const list = [];
  TEAMS.forEach((t) => {
    SLOTS.forEach((s) => {
      t[s.key].forEach((name, i) => {
        list.push({ id: `${t.abbr}-${s.key}-${i}`, name, team: t.abbr, slot: s.key, idx: i, norm: normalize(name) });
      });
    });
  });
  return list;
}

const PLAYER_INDEX = buildIndex();

const POS_TABS = ["ALL", "QB", "RB", "WR", "TE"];

const BASE_ROSTER_SLOTS = [
  { label: "QB", pos: ["qb"] },
  { label: "RB", pos: ["rb"] },
  { label: "RB", pos: ["rb"] },
  { label: "WR", pos: ["wr"] },
  { label: "WR", pos: ["wr"] },
  { label: "TE", pos: ["te"] },
  { label: "FLEX", pos: ["rb", "wr", "te"] },
];
const BENCH_MIN = 6;

function teamColor(abbr) {
  return TEAMS.find((t) => t.abbr === abbr)?.c1 || "#999999";
}

function DraftWall() {
  const [drafted, setDrafted] = useState({}); // id -> true
  const [myPicks, setMyPicks] = useState([]); // ordered array of player ids
  const [input, setInput] = useState("");
  const [suggestions, setSuggestions] = useState([]);
  const [myInput, setMyInput] = useState("");
  const [mySuggestions, setMySuggestions] = useState([]);
  const [flash, setFlash] = useState(null); // {type:'ok'|'miss', text}
  const [filter, setFilter] = useState("");
  const [posTab, setPosTab] = useState("ALL");
  const [loaded, setLoaded] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const inputRef = useRef(null);
  const myInputRef = useRef(null);
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (parsed && (parsed.drafted || parsed.myPicks)) {
            setDrafted(parsed.drafted || {});
            setMyPicks(parsed.myPicks || []);
          } else {
            // backward compatibility with the older plain-map format
            setDrafted(parsed || {});
          }
        }
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify({ drafted, myPicks }));
      } catch (e) {}
    }, 300);
    return () => clearTimeout(saveTimer.current);
  }, [drafted, myPicks, loaded]);

  useEffect(() => {
    if (!flash) return;
    const t = setTimeout(() => setFlash(null), 2200);
    return () => clearTimeout(t);
  }, [flash]);

  const draftedCount = Object.keys(drafted).filter((k) => drafted[k]).length;

  const handleInputChange = (v) => {
    setInput(v);
    if (!v.trim()) {
      setSuggestions([]);
      return;
    }
    const n = normalize(v);
    const matches = PLAYER_INDEX.filter((p) => !drafted[p.id] && p.norm.includes(n)).slice(0, 6);
    setSuggestions(matches);
  };

  const markPlayer = (player) => {
    if (!player) return;
    setDrafted((prev) => ({ ...prev, [player.id]: true }));
    setFlash({ type: "ok", text: `${player.name} — ${player.team}` });
    setInput("");
    setSuggestions([]);
    inputRef.current?.focus();
  };

  const submit = () => {
    if (!input.trim()) return;
    const n = normalize(input);
    let match = PLAYER_INDEX.find((p) => p.norm === n && !drafted[p.id]);
    if (!match) match = PLAYER_INDEX.find((p) => p.norm.includes(n) && !drafted[p.id]);
    if (match) {
      markPlayer(match);
    } else {
      setFlash({ type: "miss", text: `No match for "${input}"` });
      setInput("");
      setSuggestions([]);
    }
  };

  const toggle = (player) => {
    setDrafted((prev) => {
      const next = { ...prev };
      if (next[player.id]) delete next[player.id];
      else next[player.id] = true;
      return next;
    });
  };

  const handleMyInputChange = (v) => {
    setMyInput(v);
    if (!v.trim()) {
      setMySuggestions([]);
      return;
    }
    const n = normalize(v);
    const matches = PLAYER_INDEX.filter((p) => !drafted[p.id] && p.norm.includes(n)).slice(0, 6);
    setMySuggestions(matches);
  };

  const addToMyTeam = (player) => {
    if (!player) return;
    setDrafted((prev) => ({ ...prev, [player.id]: true }));
    setMyPicks((prev) => (prev.includes(player.id) ? prev : [...prev, player.id]));
    setFlash({ type: "ok", text: `${player.name} added to your team` });
    setMyInput("");
    setMySuggestions([]);
    myInputRef.current?.focus();
  };

  const submitMy = () => {
    if (!myInput.trim()) return;
    const n = normalize(myInput);
    let match = PLAYER_INDEX.find((p) => p.norm === n && !drafted[p.id]);
    if (!match) match = PLAYER_INDEX.find((p) => p.norm.includes(n) && !drafted[p.id]);
    if (match) {
      addToMyTeam(match);
    } else {
      setFlash({ type: "miss", text: `No match for "${myInput}"` });
      setMyInput("");
      setMySuggestions([]);
    }
  };

  const removeFromMyTeam = (id) => {
    setMyPicks((prev) => prev.filter((pid) => pid !== id));
    setDrafted((prev) => {
      const next = { ...prev };
      delete next[id];
      return next;
    });
  };

  const myPlayers = useMemo(
    () => myPicks.map((id) => PLAYER_INDEX.find((p) => p.id === id)).filter(Boolean),
    [myPicks]
  );

  const roster = useMemo(() => {
    const slots = BASE_ROSTER_SLOTS.map((s) => ({ ...s, player: null }));
    const bench = [];
    myPlayers.forEach((p) => {
      const slot = slots.find((s) => !s.player && s.pos.includes(p.slot));
      if (slot) slot.player = p;
      else bench.push(p);
    });
    while (bench.length < BENCH_MIN) bench.push(null);
    return { slots, bench };
  }, [myPlayers]);

  const doReset = () => {
    setDrafted({});
    setMyPicks([]);
    setConfirmReset(false);
  };

  const visibleTeams = useMemo(() => {
    if (!filter.trim()) return TEAMS;
    const f = filter.trim().toLowerCase();
    return TEAMS.filter((t) => t.abbr.toLowerCase().includes(f) || t.name.toLowerCase().includes(f));
  }, [filter]);

  return (
    <div style={styles.app}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        .dw-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .dw-scroll::-webkit-scrollbar-thumb { background: #CCCCCC; border-radius: 4px; }
        .dw-name { cursor: pointer; transition: color .12s ease; }
        .dw-name:hover { filter: brightness(1.3); }
        .dw-card { transition: transform .12s ease, box-shadow .12s ease; }
        .dw-card:hover { transform: translateY(-2px); }
        .dw-sugg:hover { background: #EFEFEF; }
        input:focus { outline: none; }
        @keyframes flashIn { 0% { opacity:0; transform: translateY(-4px);} 100% {opacity:1; transform:translateY(0);} }
        .dw-flash { animation: flashIn .18s ease; }
      `}</style>

      <div style={styles.headerRow}>
        <div>
          <h1 style={styles.h1}>DRAFT WALL</h1>
          <div style={styles.subtitle}>32 teams · reference board · type a name, hit enter</div>
        </div>
        <div style={styles.headerRight}>
          <div style={styles.counter}>
            {draftedCount} <span style={{ color: FAINT }}>/ {PLAYER_INDEX.length} drafted</span>
          </div>
          {!confirmReset ? (
            <button className="dw-name" style={styles.resetBtn} onClick={() => setConfirmReset(true)}>
              <RotateCcw size={14} /> Reset
            </button>
          ) : (
            <div style={{ display: "flex", gap: 6 }}>
              <button style={{ ...styles.resetBtn, background: RED, color: "#fff", borderColor: RED }} onClick={doReset}>
                Clear board
              </button>
              <button style={styles.resetBtn} onClick={() => setConfirmReset(false)}>
                Cancel
              </button>
            </div>
          )}
        </div>
      </div>

      <div style={styles.inputRow}>
        <div style={styles.inputWrap}>
          <input
            ref={inputRef}
            value={input}
            onChange={(e) => handleInputChange(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === "Enter") submit();
              if (e.key === "Escape") {
                setInput("");
                setSuggestions([]);
              }
            }}
            placeholder="Type a drafted player's name and press Enter…"
            style={styles.mainInput}
          />
          {input && (
            <X
              size={16}
              color={FAINT}
              style={{ cursor: "pointer", flexShrink: 0 }}
              onClick={() => {
                setInput("");
                setSuggestions([]);
              }}
            />
          )}
          {suggestions.length > 0 && (
            <div style={styles.suggBox}>
              {suggestions.map((s) => (
                <div key={s.id} className="dw-sugg" style={styles.suggItem} onClick={() => markPlayer(s)}>
                  <span style={{ fontWeight: 600 }}>{s.name}</span>
                  <span style={{ color: FAINT, fontFamily: "JetBrains Mono, monospace", fontSize: 11 }}>
                    {s.team} · {s.slot.toUpperCase()}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>
        <div style={styles.filterWrap}>
          <Search size={13} color={FAINT} />
          <input
            value={filter}
            onChange={(e) => setFilter(e.target.value)}
            placeholder="Jump to team…"
            style={styles.filterInput}
          />
        </div>
      </div>

      {flash && (
        <div className="dw-flash" style={{ ...styles.flashBar, borderColor: flash.type === "ok" ? "#3FDB86" : RED }}>
          {flash.type === "ok" ? "✓ marked drafted — " : "✕ "} {flash.text}
        </div>
      )}

      <div style={styles.tabs}>
        {POS_TABS.map((p) => (
          <button
            key={p}
            onClick={() => setPosTab(p)}
            style={{
              ...styles.tab,
              background: posTab === p ? "#111111" : "transparent",
              color: posTab === p ? "#FFFFFF" : DIM,
              borderColor: posTab === p ? "#111111" : BORDER,
            }}
          >
            {p}
          </button>
        ))}
      </div>

      <div style={styles.grid}>
        {visibleTeams.map((t) => {
          const headerText = textOn(t.c1);
          return (
            <div key={t.abbr} className="dw-card" style={{ ...styles.card, borderColor: t.c1 + "55" }}>
              <div style={{ ...styles.cardHeader, background: t.c1, borderBottom: `3px solid ${t.c2}` }}>
                <span style={{ ...styles.cardAbbr, color: headerText }}>{t.abbr}</span>
                <span style={{ ...styles.cardName, color: headerText }}>{t.name}</span>
              </div>
              <div style={styles.cardBody}>
                {SLOTS.filter((s) => posTab === "ALL" || s.key === posTab.toLowerCase()).map((s) => (
                  <div key={s.key} style={styles.slotRow}>
                    <span style={styles.slotLabel}>{s.label}</span>
                    <div style={styles.slotNames}>
                      {t[s.key].map((name, i) => {
                        const id = `${t.abbr}-${s.key}-${i}`;
                        const isDrafted = !!drafted[id];
                        return (
                          <span
                            key={id}
                            className="dw-name"
                            onClick={() => toggle({ id, name, team: t.abbr })}
                            title={isDrafted ? "Click to undo" : "Click to mark drafted"}
                            style={{
                              ...styles.playerName,
                              color: isDrafted ? RED : TEXT,
                              textDecoration: isDrafted ? "line-through" : "none",
                              opacity: isDrafted ? 0.85 : 1,
                            }}
                          >
                            {name}
                            {i < t[s.key].length - 1 ? <span style={styles.slashDim}> / </span> : null}
                          </span>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>

      <div style={styles.myTeamSection}>
        <div style={styles.myTeamHeader}>
          <h2 style={styles.h2}>MY TEAM</h2>
          <span style={styles.subtitle}>{myPlayers.length} picked</span>
        </div>

        <div style={styles.myInputWrap}>
          <input
            ref={myInputRef}
            value={myInput}
            onChange={(e) => handleMyInputChange(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === "Enter") submitMy();
              if (e.key === "Escape") {
                setMyInput("");
                setMySuggestions([]);
              }
            }}
            placeholder="Type a player you drafted and press Enter…"
            style={styles.mainInput}
          />
          {myInput && (
            <X
              size={16}
              color={FAINT}
              style={{ cursor: "pointer", flexShrink: 0 }}
              onClick={() => {
                setMyInput("");
                setMySuggestions([]);
              }}
            />
          )}
          {mySuggestions.length > 0 && (
            <div style={styles.suggBox}>
              {mySuggestions.map((s) => (
                <div key={s.id} className="dw-sugg" style={styles.suggItem} onClick={() => addToMyTeam(s)}>
                  <span style={{ fontWeight: 600 }}>{s.name}</span>
                  <span style={{ color: FAINT, fontFamily: "JetBrains Mono, monospace", fontSize: 11 }}>
                    {s.team} · {s.slot.toUpperCase()}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={styles.rosterList}>
          {roster.slots.map((s, i) => (
            <div key={`start-${i}`} style={styles.rosterRow}>
              <span style={styles.rosterSlotLabel}>{s.label}</span>
              {s.player ? (
                <div
                  className="dw-name"
                  style={styles.rosterPlayer}
                  onClick={() => removeFromMyTeam(s.player.id)}
                  title="Click to remove"
                >
                  <span style={{ ...styles.rosterSwatch, background: teamColor(s.player.team) }} />
                  <span style={styles.rosterName}>{s.player.name}</span>
                  <span style={styles.rosterTeam}>{s.player.team}</span>
                </div>
              ) : (
                <span style={styles.rosterEmpty}>Empty</span>
              )}
            </div>
          ))}
          {roster.bench.map((p, i) => (
            <div key={`bn-${i}`} style={styles.rosterRow}>
              <span style={styles.rosterSlotLabel}>BN</span>
              {p ? (
                <div
                  className="dw-name"
                  style={styles.rosterPlayer}
                  onClick={() => removeFromMyTeam(p.id)}
                  title="Click to remove"
                >
                  <span style={{ ...styles.rosterSwatch, background: teamColor(p.team) }} />
                  <span style={styles.rosterName}>{p.name}</span>
                  <span style={styles.rosterTeam}>{p.team}</span>
                </div>
              ) : (
                <span style={styles.rosterEmpty}>Empty</span>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
